name: Build Kolabhoomi APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project
        run: |
          mkdir project
          unzip -q kolabhoomi-art-academy.zip -d project
          find project -name settings.gradle.kts

      - name: Build APK
        run: |
          DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$DIR"
          gradle -p "$DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Kolabhoomi-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          
