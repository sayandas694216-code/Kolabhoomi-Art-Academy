
name: Kolabhoomi Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android Project
        id: project
        run: |
          PROJECT_DIR=$(find . -name settings.gradle.kts -not -path '*/.gradle/*' -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found project at $PROJECT_DIR"

      - name: Build Debug APK
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kolabhoomi-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
